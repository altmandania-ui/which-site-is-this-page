<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איזה אתר זה?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. The premise. -->
<section id="screen-1" class="screen stage" hidden>
  <p class="big">עכשיו אתם הסוכן.</p>
  <p class="small">שלושה אתרים שאתם מכירים, כמו שסוכן AI מקבל אותם. שלוש משימות. השעון רץ.</p>
</section>

<!-- 2 to 4. One round per site. The room is the agent: it gets a task and the page's whole text,
     to scroll through. Then the same page as an agent that looks gets it: one picture, shrunk, cut
     into pieces, and the pieces put one after another in an array. Then the real page, whole. Then both together: where the eye found the
     answer, and what the agent had instead. -->
<section id="screen-round" class="screen stage" hidden>
  <div class="round-head">
    <div>
      <p id="round-ask" class="ask"></p>
      <p id="round-mode" class="small mode"></p>
      <p id="round-array" class="agent array-line" dir="ltr"></p>
    </div>
    <p id="round-count" class="small" dir="ltr"></p>
  </div>
  <div id="round-text" class="agent feed" tabindex="-1"></div>
  <div id="round-seen" class="seen" tabindex="-1" hidden><div id="seen-array" class="seen-array" dir="ltr"></div></div>
  <div id="round-page" class="page" tabindex="-1"><img id="page-img" alt=""></div>
  <div id="round-look" class="look">
    <div class="look-row">
      <div class="look-shot"><img id="look-img" alt=""><div id="look-spot" class="spot"></div></div>
      <div id="look-text" class="agent"></div>
    </div>
    <div>
      <p id="look-time" class="small time"></p>
      <p id="look-seen" class="small time"></p>
      <p id="look-caption" class="small"></p>
    </div>
  </div>
</section>

<!-- 5. All three at once: the same to the agent, nothing alike to the eye. -->
<section id="screen-all" class="screen stage" hidden>
  <div id="all-cols" class="cols"></div>
</section>

<!-- 6. The bill: what the design said on each page, cut from the page, and what reached the agent. -->
<section id="screen-sum" class="screen stage" hidden>
  <div id="sum-rows" class="sum-rows"></div>
  <div id="sum-foot" class="sum-foot">
    <p class="big">מה שהעיצוב אומר בלי מילים, לא מגיע לסוכן.</p>
    <p id="sum-time" class="small"></p>
  </div>
</section>

<!-- 7. The end. -->
<section id="screen-end" class="screen stage end" hidden>
  <p class="big">ככה סוכן רואה את העבודה שלכם. כבר היום.</p>
  <p class="small after">מודל חכם יותר לא יתקן את זה: הוא לא יכול לקרוא מה שהעמוד לא שלח לו. גם את זה צריך לעצב.</p>
</section>

<!-- On a touch screen there are no keys: two buttons at the foot of the screen move back and forward. -->
<nav id="touch-nav" class="touch-nav">
  <button id="nav-back" type="button">חזרה</button>
  <span id="nav-at" dir="ltr"></span>
  <button id="nav-next" type="button">המשך</button>
</nav>

<!-- Presenter hint: what the next key does. Press H to hide or show it. -->
<div id="hint" class="hint-line"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
